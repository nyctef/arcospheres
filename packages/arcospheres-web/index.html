<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>arcospheres</title>
    <style>
      :root { color-scheme: dark; --accent: #44aaff; --border: #36393d; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #111; }
      body { color: #e7edf2; font-family: "Trebuchet MS", sans-serif; }
      .app { display: grid; grid-template-columns: minmax(0, 1fr) 224px; height: 100%; }
      #viewport { min-width: 0; min-height: 0; overflow: hidden; }
      #viewport canvas { display: block; width: 100%; height: 100%; }
      aside { padding: 24px 20px; background: #1c1e21; border-left: 1px solid var(--border); overflow-y: auto; }
      h1 { margin: 0 0 28px; font-size: 18px; font-weight: 600; }
      #rotation-controls { display: grid; gap: 24px; }
      .rotation-control { display: grid; grid-template-columns: 1fr 64px; gap: 10px; align-items: center; }
      label { font-size: 14px; }
      output { text-align: right; color: #a9bac8; font-size: 13px; font-variant-numeric: tabular-nums; }
      input[type="range"] { grid-column: 1 / -1; width: 100%; margin: 0; accent-color: var(--accent); cursor: pointer; }
      button { margin-top: 32px; padding: 8px 14px; border: 1px solid var(--border); border-radius: 4px; background: #292d32; color: #e7edf2; font: inherit; font-size: 13px; cursor: pointer; }
      button:hover { background: #353b43; }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
      @media (max-width: 600px) {
        .app { grid-template-columns: minmax(0, 1fr) 132px; }
        aside { padding: 20px 12px; }
        h1 { font-size: 16px; }
        .rotation-control { grid-template-columns: 1fr 52px; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <main id="viewport" aria-label="Tesseract view"></main>
      <aside aria-label="4D rotation controls">
        <h1>Rotation</h1>
        <div id="rotation-controls"></div>
        <button id="reset-rotation" type="button">Reset</button>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
