<!doctype html>
<html lang="en">
  <head>
    <title>map</title>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
        }
      }
    </script>
  </head>
  <body></body>
  <script type="module">
    import * as THREE from "three";
    import { TrackballControls } from 'three/addons/controls/TrackballControls.js';

    // console.log(THREE);
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(
      75, // fov
      window.innerWidth / window.innerHeight, // aspect ratio
      0.1, // near clip
      99999999, // far clip
    );
    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const mapdata = {{ mapdata|tojson }};
    // console.log(mapdata);

    for (const star of mapdata.stars) {
      const geometry = new THREE.SphereGeometry(0.02, 6, 4);
      const material = new THREE.MeshBasicMaterial({ color: 0xffff00 });
      const sphere = new THREE.Mesh(geometry, material);
      sphere.position.set(star.x, star.y, star.z);
      scene.add(sphere);
    }

    const gate = {x: 0.34209017978238, y: -0.68402658695964, z: -0.64426852882071};
    const gateGeometry = new THREE.SphereGeometry(0.05, 6, 4);
    const gateSphere = new THREE.Mesh(gateGeometry, new THREE.MeshBasicMaterial({ color: 0xffffff }));
    gateSphere.position.set(gate.x, gate.y, gate.z);
    scene.add(gateSphere);

    const xaxis = new THREE.BoxGeometry(2, 0.01, 0.01);
    scene.add(new THREE.Mesh(xaxis, new THREE.MeshBasicMaterial({ color: 0x770000 })));
    const yaxis = new THREE.BoxGeometry(0.01, 2, 0.01);
    scene.add(new THREE.Mesh(yaxis, new THREE.MeshBasicMaterial({ color: 0x007700 })));
    const zaxis = new THREE.BoxGeometry(0.01, 0.01, 2);
    scene.add(new THREE.Mesh(zaxis, new THREE.MeshBasicMaterial({ color: 0x0000aa })));

    // const geometry = new THREE.BoxGeometry(1,1,1);
    // const material = new THREE.MeshBasicMaterial({color: 0x00ff00});
    // const cube = new THREE.Mesh(geometry, material);
    // scene.add(cube);

    camera.position.z = 1.5;

    const controls = new TrackballControls(camera, renderer.domElement);
    controls.rotateSpeed = 2.0;
    // we're setting up our own zoom to switch between perspective and orthographic cameras
    controls.noZoom = true;

    /*

    dolly zoom: imagine a camera pointing horizontally at a centered object of height H.

                                    ⠄   ⠂   ⠁ | ↑
                        ⠄   ⠂   ⠁             |
            ⠄  ⠂   ⠁                          |
    camera ....................................| H
                    ←  d  →                    |
                                               |
                                               | ↓

    This setup makes a right-angled triangle with an opposite side of H/2 and an adjacent side of d.

    The angle of the triangle (fov/2) is given by tan(fov/2) = (H/2) / d

    the general idea of the below code is to keep H constant (so the object stays the same
    size on screen) while changing d, and then using the above equation to figure out the
    correct fov value as a result.

    */

    // FOV in degrees. technically a FOV_MIN of 0.5 is still a perspective camera,
    // but it's close enough that the difference shouldn't be noticable and actually switching
    // to THREE.OrthographicCamera would be a lot more fiddly.
    const FOV_MAX = 100, FOV_MIN = 0.5;
    // fov is nonlinear (changes near zero are much more noticable than changes near 90)
    // so we interpolate on the tangent instead.
    const tanMax = Math.tan(THREE.MathUtils.degToRad(FOV_MAX / 2));
    const tanMin = Math.tan(THREE.MathUtils.degToRad(FOV_MIN / 2));

    // const sceneSize = 1.5; // all points are in [-1, 1] so this gives us a little extra screen space
    const basePan = controls.panSpeed;
    const H = 2 * camera.position.distanceTo(controls.target) * tanMax;

    let perspective_amount = 0.75;

    function applyProjection(perspective_amount) {
        // rearrange the above tan equation to figure out how far away to put the camera
        const tanHalf = THREE.MathUtils.lerp(tanMin, tanMax, perspective_amount);
        const camera_dist = (H / 2) / tanHalf;

        const dir = camera.position.clone().sub(controls.target).normalize();
        camera.position.copy(controls.target).addScaledVector(dir, camera_dist);

        // and then adjust the camera FOV to match
        camera.fov = 2 * THREE.MathUtils.radToDeg(Math.atan(tanHalf));
        camera.updateProjectionMatrix();

        controls.panSpeed = basePan * tanHalf / tanMax;
    }

    renderer.domElement.addEventListener('wheel', (e) => {
        // since we disabled the zoom on the built-in controls, this mousewheel handler shouldn't fight with them
        e.preventDefault();

        // scroll down to zoom out (more orthographic), scroll up to zoom in (more perspective)
        perspective_amount = THREE.MathUtils.clamp(perspective_amount - e.deltaY * 0.001, 0, 1);
    }, { passive: false });

    function animate(time) {
        applyProjection(perspective_amount);
        controls.update();
        renderer.render(scene, camera);
    }
    renderer.setAnimationLoop(animate);
  </script>
</html>
