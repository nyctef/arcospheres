[project]
name = "arcospheres"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.15"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/arcospheres-cli",
    "packages/bp-dump",
    "galaxy-map",
    "packages/galaxy-map",
]


[tool.uv.config-settings-package]
# lupa doesn't (currently) have a prebuilt binary for py 3.15, so skip a problematic build step for now
lupa = { "--build-option" = "--no-luajit" }
